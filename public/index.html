<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMEC</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>SMEC</h1>
        <p class="app__subtitle">Starter workspace &mdash; verify the Cloud Agent environment end to end.</p>
        <span id="health" class="badge badge--pending">checking&hellip;</span>
      </header>

      <form id="new-item" class="new-item">
        <input id="title" class="new-item__input" type="text" placeholder="Add an item&hellip;" autocomplete="off" />
        <button class="new-item__button" type="submit">Add</button>
      </form>

      <ul id="items" class="items"></ul>
      <p id="empty" class="items__empty">No items yet. Add your first one above.</p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
